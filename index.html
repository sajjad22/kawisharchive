<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روزاني ڪاوش - مضمون ۽ مقالا آرڪائيو</title>
  <link rel="stylesheet" href="assets/style.css?v=5.0">
</head>
<body class="theme-sepia">
  <div class="container" id="app">
    <!-- Dynamic Single-Page App Views render here -->
  </div>

  <script>
    let authorsData = [];
    let articlesIndex = [];
    let currentTheme = localStorage.getItem('kawish_theme_static') || 'theme-sepia';
    let currentFilterYear = null;

    document.body.className = currentTheme;

    // Comprehensive client-side legacy font & entity decoder map
    const cpMap = {
      'Ё': 'ف', 'д': 'ن', 'н': 'ي', '”': 'س', 'б': 'ل', 'Ќ': 'ح',
      'ў': 'ظ', 'Ш': 'ٽ', '«': 'ا', 'џ': 'غ', 'г': 'م', '¬': 'آ',
      'ен': 'هي', 'њ': '؟', '—': 'ر', 'Џ': 'ع', 'ж': 'و', 'Ў': 'ف',
      '∆': 'ي', 'ڇ': 'چ', 'ڏ': 'د', 'Б': 'پ', 'ٽ': 'ت', 'ћ': 'ت',
      'Ѕ': 'ي', 'ц': 'ء', '°': '۔', 'ڙ': 'ڙ', 'ڀ': 'ڀ', '‘': 'ش',
      '÷': 'ض', 'Р': 'ذ', 'х': 'خ', 'µ': 'ع', '’': 'ط', 'ќ': 'خ',
      'ڪ': 'ڪ', 'ڊ': 'ڊ', 'е': 'ه', 'ڻ': 'ڻ'
    };

    function sanitizeAndDecodeText(str) {
      if (!str) return '';
      
      // 1. Decode legacy numeric/hashed HTML entities (e.g., #1706; or &#1706;)
      let text = str.replace(/#(\d+);/g, '&#$1;');
      const txt = document.createElement('textarea');
      txt.innerHTML = text;
      text = txt.value.replace(/&/g, '');

      // 2. Decode legacy font byte mis-mappings
      let result = '';
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        result += cpMap[ch] || ch;
      }
      return result;
    }

    // Load Central JSON Data
    async function initData() {
      try {
        const [authRes, artRes] = await Promise.all([
          fetch('data/authors.json'),
          fetch('data/articles_index.json')
        ]);
        authorsData = await authRes.json();
        articlesIndex = await artRes.json();
        handleRoute();
      } catch (err) {
        console.error('Error loading CMS data:', err);
        document.getElementById('app').innerHTML = '<div style="text-align:center; padding: 40px;"><h2>ڊيٽا لوڊ ڪرڻ ۾ نقص پيش آيو.</h2></div>';
      }
    }

    // Hash Router for Single Page CMS
    window.addEventListener('hashchange', handleRoute);

    function handleRoute() {
      const hash = window.location.hash || '#hub';
      if (hash.startsWith('#author/')) {
        const authorId = decodeURIComponent(hash.replace('#author/', ''));
        renderAuthorView(authorId);
      } else if (hash.startsWith('#article/')) {
        const articleId = decodeURIComponent(hash.replace('#article/', ''));
        renderArticleView(articleId);
      } else {
        renderHubView();
      }
      window.scrollTo(0, 0);
    }

    function changeTheme(themeName) {
      currentTheme = themeName;
      document.body.className = themeName;
      localStorage.setItem('kawish_theme_static', themeName);
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-theme') === themeName);
      });
    }

    // Render Shared Top Nav
    function getNavHTML(backLink, backText) {
      return `
        <nav class="nav-toolbar">
          <div style="display: flex; gap: 8px; align-items: center;">
            ${backLink ? `<a href="${backLink}" class="btn-back"><span>${backText}</span></a>` : ''}
            <a href="#hub" class="btn-back"><span>🏠 مکيه صفحو</span></a>
          </div>
          <div class="theme-controls">
            <button class="theme-btn ${currentTheme === 'theme-light' ? 'active' : ''}" data-theme="theme-light" onclick="changeTheme('theme-light')">اڇو</button>
            <button class="theme-btn ${currentTheme === 'theme-sepia' ? 'active' : ''}" data-theme="theme-sepia" onclick="changeTheme('theme-sepia')">سيپيا</button>
            <button class="theme-btn ${currentTheme === 'theme-dark' ? 'active' : ''}" data-theme="theme-dark" onclick="changeTheme('theme-dark')">تاريڪ</button>
          </div>
        </nav>
      `;
    }

    // 1. Hub Portal View
    function renderHubView() {
      const app = document.getElementById('app');
      const cardsHTML = authorsData.map(a => `
        <a href="#author/${encodeURIComponent(a.id)}" class="author-hub-card" data-name="${a.name_sd.toLowerCase()}" data-english="${a.name_en.toLowerCase()}">
          <div class="hub-avatar">${a.initials}</div>
          <div class="hub-title">${a.name_sd}</div>
          <div class="hub-title-english">${a.name_en}</div>
          <div class="hub-meta">
            <span>📚 ${a.count} مضمون</span>
            <span>سائيٽ ڏسو ←</span>
          </div>
        </a>
      `).join('');

      app.innerHTML = `
        ${getNavHTML(null, null)}
        <header class="main-header">
          <div class="author-badge">K</div>
          <h1>مصنفن جو مکيه پورٽل</h1>
          <p>ڪُل <span id="visibleAuthorCount">${authorsData.length}</span> مصنفن جا مضمون موجود آهن</p>
        </header>

        <section class="controls-card">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="hubSearchInput" class="search-input" placeholder="مصنف جي نالي مان ڳوليو..." oninput="filterAuthorsHub()">
          </div>
        </section>

        <main class="authors-grid">${cardsHTML}</main>
      `;
    }

    // 2. Author Articles List View
    function renderAuthorView(authorId) {
      const app = document.getElementById('app');
      const author = authorsData.find(a => a.id === authorId) || { name_sd: authorId, name_en: authorId, initials: 'KA' };
      const authorArticles = articlesIndex.filter(a => a.author_id === authorId);
      
      const years = [...new Set(authorArticles.map(a => a.year).filter(Boolean))].sort().reverse();
      const yearFiltersHTML = years.map(y => `
        <button class="filter-btn ${currentFilterYear === y ? 'active' : ''}" onclick="filterYear('${y}')">${y}ع</button>
      `).join('');

      const cardsHTML = authorArticles.map(a => `
        <div class="article-card-wrapper">
          <a href="#article/${encodeURIComponent(a.id)}" class="article-card" data-title="${a.title.toLowerCase()}" data-year="${a.year}" data-snippet="${a.snippet.toLowerCase()}">
            <div class="card-header-row">
              <h2 class="card-title">${a.title}</h2>
              <span class="card-date">${a.date}</span>
            </div>
            <p class="card-snippet">${a.snippet}</p>
            <div class="card-footer">
              <span>⏱️ ${a.readTime} منٽ</span>
              <span class="card-meta-tag">${a.year ? a.year + 'ع' : 'آرڪائيو'}</span>
            </div>
          </a>
        </div>
      `).join('');

      app.innerHTML = `
        ${getNavHTML('#hub', '🏠 مکيه صفحو')}
        <header class="main-header">
          <div class="author-badge">${author.initials}</div>
          <h1>${author.name_sd}</h1>
          <div class="author-english-sub">${author.name_en}</div>
          <p>ڪُل <span id="visibleCount">${authorArticles.length}</span> مضمون</p>
        </header>

        <section class="controls-card">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="مضمون جي عنوان يا مواد مان ڳوليو..." oninput="filterArticles()">
          </div>
          <div class="filters-row">
            <span style="font-size: 13px; color: var(--text-muted);">سال:</span>
            ${yearFiltersHTML}
          </div>
        </section>

        <main class="articles-grid">${cardsHTML}</main>
      `;

      filterArticles();
    }

    // 3. Article Reading View
    async function renderArticleView(articleId) {
      const app = document.getElementById('app');
      const meta = articlesIndex.find(a => a.id === articleId);
      const author = authorsData.find(a => a.id === (meta ? meta.author_id : '')) || { name_sd: 'مصنف' };

      app.innerHTML = `
        ${getNavHTML('#author/' + encodeURIComponent(meta ? meta.author_id : ''), '← ' + author.name_sd + ' جا مضمون')}
        <main class="reading-pane">
          <div style="text-align: center; padding: 40px;">
            <p>مضمون لوڊ ٿي رهيو آهي...</p>
          </div>
        </main>
      `;

      try {
        const res = await fetch(`data/articles/${encodeURIComponent(articleId)}.json`);
        const article = await res.json();
        const origUrlHTML = article.url ? `<span>🔗 <a href="${article.url}" class="meta-link" target="_blank" rel="noopener">ڪاوش اخبار تي اصل مضمون</a></span>` : '';

        app.innerHTML = `
          ${getNavHTML('#author/' + encodeURIComponent(article.author_id), '← ' + author.name_sd + ' جا مضمون')}
          <main class="reading-pane">
            <header class="article-meta-header">
              <h1 class="article-heading">${article.title}</h1>
              <div class="meta-info-row">
                <span>✍️ ${author.name_sd}</span>
                <span>📅 ${article.date}</span>
                <span>⏱️ ${article.readTime} منٽ</span>
                ${origUrlHTML}
              </div>
            </header>

            <article class="article-body">${article.body}</article>
            
            <div class="copy-action-bar">
              <button id="copyArticleBtn" class="btn-copy-article" onclick="copyArticleContent()">
                <span>📋 مضمون ڪاپي ڪريو</span>
              </button>
            </div>
          </main>
        `;
      } catch (err) {
        console.error('Error fetching article detail:', err);
        app.innerHTML = `
          ${getNavHTML('#hub', '🏠 مکيه صفحو')}
          <main class="reading-pane">
            <div style="text-align: center; padding: 40px;">
              <h2>مضمون لوڊ ڪرڻ ۾ نقص.</h2>
              ${meta && meta.url ? `<p style="margin-top:15px;"><a href="${meta.url}" target="_blank" class="btn-copy-article">🔗 ڪاوش اخبار تي اصل مضمون پڙهو</a></p>` : ''}
            </div>
          </main>
        `;
      }
    }

    // Filtering Helpers
    function filterAuthorsHub() {
      const query = document.getElementById('hubSearchInput')?.value.toLowerCase().trim() || '';
      const cards = document.querySelectorAll('.author-hub-card');
      let visibleCount = 0;
      cards.forEach(card => {
        const title = card.getAttribute('data-name') || '';
        const englishName = card.getAttribute('data-english') || '';
        if (!query || title.includes(query) || englishName.includes(query)) {
          card.style.display = 'flex';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });
      const counterEl = document.getElementById('visibleAuthorCount');
      if (counterEl) counterEl.textContent = visibleCount;
    }

    function filterArticles() {
      const query = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';
      const wrappers = document.querySelectorAll('.article-card-wrapper');
      let visibleCount = 0;
      wrappers.forEach(w => {
        const card = w.querySelector('.article-card');
        const title = card.getAttribute('data-title') || '';
        const snippet = card.getAttribute('data-snippet') || '';
        const year = card.getAttribute('data-year') || '';
        const matchesSearch = !query || title.includes(query) || snippet.includes(query);
        const matchesYear = !currentFilterYear || year === currentFilterYear;
        if (matchesSearch && matchesYear) {
          w.style.display = 'block';
          visibleCount++;
        } else {
          w.style.display = 'none';
        }
      });
      const counterEl = document.getElementById('visibleCount');
      if (counterEl) counterEl.textContent = visibleCount;
    }

    function filterYear(yearStr) {
      currentFilterYear = (currentFilterYear === yearStr) ? null : yearStr;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', currentFilterYear && btn.textContent.includes(currentFilterYear));
      });
      filterArticles();
    }

    // Copy Content Function with Automatic Sanitization & Decoding
    function copyArticleContent() {
      const rawHeading = document.querySelector('.article-heading')?.innerText || '';
      const rawBodyText = document.querySelector('.article-body')?.innerText || '';
      
      const cleanHeading = sanitizeAndDecodeText(rawHeading);
      const cleanBody = sanitizeAndDecodeText(rawBodyText);
      const fullCleanText = cleanHeading + '\n\n' + cleanBody;
      
      navigator.clipboard.writeText(fullCleanText).then(() => {
        const copyBtn = document.getElementById('copyArticleBtn');
        if (copyBtn) {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = '<span>✓ ڪاپي ٿي ويو!</span>';
          setTimeout(() => {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = '<span>📋 مضمون ڪاپي ڪريو</span>';
          }, 2500);
        }
      }).catch(err => console.error(err));
    }

    // Start App
    initData();
  </script>
</body>
</html>
